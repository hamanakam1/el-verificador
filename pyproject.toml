[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "el-verificador"
version = "0.1.0"
description = "El Verificador - autonomous gatekeeper for the Taskrivet pipeline"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Michael Hamanaka"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Shells",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pydantic>=2.5",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "mypy>=1.8",
    "ruff>=0.1.0",
]
mcp = [
    "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/hamanakam1/el-verificador"
Repository = "https://github.com/hamanakam1/el-verificador"
Issues = "https://github.com/hamanakam1/el-verificador/issues"

[project.scripts]
el-verificador = "el_verificador.__main__:main"
el-verificador-mcp = "el_verificador.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["el_verificador*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"
# The golden fixture suite contains synthetic repositories that are meant to
# contain stubs and unused imports. They are data, not source.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# E/F/W are correctness. I is import hygiene. UP is pyupgrade, minus the
# rules the codebase has never met: it uses `typing.List` / `typing.Optional`
# consistently, and a PEP 585/604 migration is a separate mechanical change
# rather than something to slip in with a feature commit.
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "E501",
    "UP006",   # non-pep585-annotation (typing.List -> list)
    "UP007",   # non-pep604-annotation-union (Optional[X] -> X | None)
    "UP035",   # deprecated-import (typing.List -> collections.abc)
    "UP037",   # quoted-annotation
    "UP042",   # replace-str-enum (class X(str, Enum) is deliberate here)
    "UP045",   # non-pep604-annotation-optional (Optional[X] -> X | None)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
norecursedirs = ["tests/fixtures", "*.egg", ".*", "build", "dist"]
addopts = "-v"

[tool.coverage.run]
source = ["el_verificador"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
show_missing = true
